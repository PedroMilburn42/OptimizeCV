<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>[YOUR_NAME] - Cover Letter</title>
<style>
  @page { size: A4; margin: 2.2cm 2.4cm; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 11pt; color: #1a1a1a; background: #ffffff; line-height: 1.45; }
  .sender { margin-bottom: 18pt; }
  .date { margin-bottom: 18pt; }
  .recipient { margin-bottom: 18pt; }
  p { margin: 0 0 10pt 0; }
  ul { margin: 0 0 10pt 0; padding-left: 16pt; break-inside: avoid; }
  li { margin-bottom: 2pt; }
  .signature { margin-top: 18pt; }
</style>
</head>
<body>
  <div class="sender">[YOUR_NAME]<br>[YOUR_CITY], [YOUR_COUNTRY]<br>[YOUR_EMAIL] &middot; [YOUR_PHONE]</div>
  <div class="date">[DATE]</div>
  <div class="recipient">[RECIPIENT_NAME_OR_HIRING_MANAGER]<br>[COMPANY]</div>

  <p>[OPENING_PARAGRAPH]</p>
  <p>[BODY_PARAGRAPH_1]</p>
  <ul>
    <li>[HIGHLIGHT_BULLET_1]</li>
    <li>[HIGHLIGHT_BULLET_2]</li>
  </ul>
  <p>[CLOSING_PARAGRAPH]</p>

  <div class="signature">Sincerely,<br>[YOUR_NAME]</div>
</body>
</html>
